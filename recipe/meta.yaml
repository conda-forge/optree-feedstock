{% set name = "optree" %}
{% set version = "0.20.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c7403eb0f2b2a060a97803a8f52904212df85ed6cff4b0eeed9cc6e38c2cf88d

build:
  script: |
    {{ PYTHON }} -m pip install -vv --no-deps --no-build-isolation .
  number: 1
  # NOTE: do not unset `CMAKE_GENERATOR` here. The vc activation script sets it
  # (with `CMAKE_GENERATOR_PLATFORM`/`CMAKE_GENERATOR_TOOLSET`) to a generator
  # matching the Visual Studio actually installed on the image. The
  # windows-11-arm runners ship VS 2026, and unsetting the variable makes CMake
  # default to the nonexistent "Visual Studio 17 2022" generator.

requirements:
  build:
    - python                              # [build_platform != target_platform]
    - cross-python_{{ target_platform }}  # [build_platform != target_platform]
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake >=3.18  # to support `CMAKE_GENERATOR`
    - make                                # [not win]
  host:
    - pip
    - setuptools
    - python
    - pybind11 >=2.12
  run:
    - python
    - typing-extensions >=4.10  # [py < 313]
    - typing-extensions >=4.12  # [py >= 313 and py < 315]
    - typing-extensions >=4.14  # [py >= 315]

test:
  imports:
    - optree
  source_files:
    - pyproject.toml
    - tests
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -Walways -Werror --showlocals tests

about:
  home: https://github.com/metaopt/optree
  summary: Optimized PyTree Utilities
  description: Optimized PyTree Utilities.
  dev_url: https://github.com/metaopt/optree
  doc_url: https://optree.readthedocs.io
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE

extra:
  recipe-maintainers:
    - XuehaiPan
